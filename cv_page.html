<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" />
    <title>Input Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Upload Your Details</h1>
    <form>
      <label>Name:</label>
      <input type="text" placeholder="Write your name." required /><br /><br />
      <label>Date:</label>
      <input type="datetime" placeholder="Write date." required /><br /><br />

      <label>Upload Image:</label>
      <input type="file" accept="image/*" required /><br /><br />
      <label>Upload PDF:</label>
      <input type="file" accept="application/pdf" required /><br />
      <br />
      <label>Choose your programming language:</label><br />

      <input type="radio" value="HTML" />
      <label>HTML</label><br />
      <input type="radio" value="CSS" />
      <label>CSS</label><br />
      <input type="radio" value="JavaScript" />
      <label>JavaScript</label><br />
      <br />
      <ol style="list-style-type: decimal-leading-zero">
        <li>List 1</li>
        <li>List 2</li>
        <li>List 3</li>
        <li>Coffee</li>
        <dd>- black hot drink</dd>
        <li>Milk</li>
        <dd>- white cold drink</dd>
      </ol>
      <br />
      <label>Choose your desk:</label><br />
      <input type="checkbox" value="Bike" />
      <label> Desk 1</label><br />
      <input type="checkbox" value="Car" />
      <label> Desk 2</label><br />
      <input type="checkbox" value="Boat" />
      <label> Desk 3</label> <br /><br /><br />
      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
